document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"509fe8eb-0e21-4d28-908d-35d6dd244b5b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 300 800;\n  font-stretch: 62% 125%;\n  font-display: swap;\n  src: url(\"4a1e0660-82d2-4b9a-912b-d7fa15bf1c88\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 300 800;\n  font-stretch: 62% 125%;\n  font-display: swap;\n  src: url(\"31110683-279a-4ee2-b9ab-0951d6136c69\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 300 800;\n  font-stretch: 62% 125%;\n  font-display: swap;\n  src: url(\"4d70ffef-ed4b-4ddd-8b17-eeb789564d5d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F3F3EE;color:#231F20;font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#1F6B47}a:hover{color:#231F20}\nbutton,input,textarea{font-family:inherit}\n<\u002Fstyle>\n<script src=\"924f4f97-fd77-4732-b380-112909546522\"><\u002Fscript>\n\n<\u002Fhelmet>\n<div style=\"display:flex;flex-wrap:wrap;min-height:100vh;background:#F3F3EE\">\n\n<aside style=\"flex:1 0 248px;max-width:300px;background:#231F20;color:#F3F3EE;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto;padding:28px 18px 24px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:14px;padding:0 8px\">\n    <img src=\"2e1d5a21-0392-42e3-b78a-d21430992cef\" alt=\"Venture Home\" style=\"width:58px;height:auto;display:block\">\n    <div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B1C3B5;font-weight:600\">Solar Consultant Training<\u002Fdiv>\n  <\u002Fdiv>\n  <nav style=\"display:flex;flex-direction:column;gap:4px\">\n    <button sc-camel-on-click=\"{{ goSkills }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 10px;border-radius:10px;background:{{ skillsBg }};color:{{ skillsFg }}\">\n      <span style=\"font-weight:700;font-size:15px\">The 10 Core Skills<\u002Fspan>\n      <span style=\"font-size:12px;opacity:.8\">Start here<\u002Fspan>\n    <\u002Fbutton>\n    <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B1C3B5;font-weight:700;padding:18px 10px 6px\">Phase 1 · 8 days<\u002Fdiv>\n    <sc-for list=\"{{ navDays }}\" as=\"d\" hint-placeholder-count=\"5\">\n      <sc-if value=\"{{ d.isMarker }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:10px;align-items:baseline;padding:8px 10px;color:#B1C3B5;font-size:13px\">\n          <span style=\"font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;width:56px;flex:none\">{{ d.label }}<\u002Fspan>\n          <span>{{ d.title }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ d.isDay }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:11px 10px;border-radius:10px;background:{{ d.bg }};color:{{ d.fg }}\">\n          <span style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n            <span style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700\">{{ d.label }}<\u002Fspan>\n            <span style=\"font-size:12px;opacity:.75\">{{ d.count }}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:15px;font-weight:500;line-height:1.25\">{{ d.title }}<\u002Fspan>\n          <span style=\"display:block;height:3px;border-radius:2px;background:rgba(122,239,178,.18);overflow:hidden\"><span style=\"display:block;height:100%;width:{{ d.pct }};background:#7AEFB2\"><\u002Fspan><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n    <div style=\"height:1px;background:rgba(243,243,238,.12);margin:12px 4px\"><\u002Fdiv>\n    <button sc-camel-on-click=\"{{ goRubric }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 10px;border-radius:10px;background:{{ rubricBg }};color:{{ rubricFg }}\">\n      <span style=\"font-weight:700;font-size:15px\">Final Pitch Scorecard<\u002Fspan>\n      <span style=\"font-size:12px;opacity:.8\">{{ rubricNav }}<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fnav>\n  <div style=\"margin-top:auto;padding:0 8px;font-size:12px;line-height:1.5;color:#B1C3B5\">Progress saves on this device.<\u002Fdiv>\n<\u002Faside>\n\n<main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n\n<sc-if value=\"{{ isSkills }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"background-color:#231F20;background-image:linear-gradient(rgba(35,31,32,.84),rgba(35,31,32,.84)),url(&quot;b400925a-1974-43c8-9fb2-3d8bb6c92089&quot;);background-size:cover;background-position:center;color:#F3F3EE;padding:56px clamp(24px,5vw,64px) 48px\">\n    <div style=\"max-width:880px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7AEFB2;font-weight:700\">8 days · 5 in office · 10 skills<\u002Fdiv>\n      <h1 style=\"margin:0;font-stretch:125%;font-weight:800;font-size:clamp(36px,5vw,60px);line-height:1;letter-spacing:-.02em\">The 10 Core Skills<\u002Fh1>\n      <p style=\"margin:0;font-size:19px;line-height:1.5;max-width:640px;text-wrap:pretty\">Every consultant does all ten by the end of the five in-office days. Each has a session where it’s taught and a moment where you prove it. Day 9, you run your first appointment.<\u002Fp>\n      <div style=\"margin-top:8px\"><button sc-camel-on-click=\"{{ startDay1 }}\" style=\"all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:999px;background:#7AEFB2;color:#231F20;font-weight:700;font-size:15px\">Start Day 1 →<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section style=\"padding:40px clamp(20px,5vw,64px) 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px;max-width:1280px\">\n    <sc-for list=\"{{ skills }}\" as=\"k\" hint-placeholder-count=\"10\">\n      <article style=\"background:#FFFFFF;border:1px solid #DEDFD6;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;gap:14px;align-items:flex-start\">\n          <div style=\"flex:none;width:44px;height:44px;border-radius:12px;background:{{ k.badgeBg }};color:#231F20;display:flex;align-items:center;justify-content:center;font-stretch:125%;font-weight:800;font-size:18px\">{{ k.n }}<\u002Fdiv>\n          <h2 style=\"margin:0;font-stretch:115%;font-size:21px;line-height:1.2;font-weight:700;padding-top:9px;text-wrap:pretty\">{{ k.title }}<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;text-wrap:pretty\">{{ k.idea }}<\u002Fp>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A4547;text-wrap:pretty\">{{ k.how }}<\u002Fp>\n        <sc-if value=\"{{ k.say }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:15px;line-height:1.5;font-style:italic;padding:12px 14px;background:#F3F3EE;border-radius:10px\">{{ k.say }}<\u002Fp>\n        <\u002Fsc-if>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;font-weight:600\">{{ k.rule }}<\u002Fp>\n        <div style=\"margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px;border-top:1px solid #E8E8E1\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#1F6B47\">Taught<\u002Fspan><span style=\"font-size:13px;line-height:1.4\">{{ k.taught }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#1F6B47\">Proved<\u002Fspan><span style=\"font-size:13px;line-height:1.4\">{{ k.proved }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRubric }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"background-color:#231F20;background-image:linear-gradient(rgba(35,31,32,.84),rgba(35,31,32,.84)),url(&quot;b400925a-1974-43c8-9fb2-3d8bb6c92089&quot;);background-size:cover;background-position:center;color:#F3F3EE;padding:48px clamp(24px,5vw,64px) 40px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:flex-end;max-width:1100px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;max-width:600px\">\n        <div style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#7AEFB2;font-weight:700\">Day 4 · Friday · Skill 5<\u002Fdiv>\n        <h1 style=\"margin:0;font-stretch:125%;font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.02em\">Final Pitch Scorecard<\u002Fh1>\n        <p style=\"margin:0;font-size:17px;line-height:1.5;text-wrap:pretty\">Manager scores each area 0–4 while you pitch. 80 or above passes. How you say it counts as much as what you say.<\u002Fp>\n        <span style=\"align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1.5px dashed #F3F3EE\">Draft weights · needs review<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:6px\">\n        <div style=\"font-stretch:125%;font-weight:800;font-size:96px;line-height:.9;color:{{ scoreColor }};font-variant-numeric:tabular-nums\">{{ score }}<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;color:{{ scoreColor }}\">{{ scoreStatus }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div style=\"padding:32px clamp(20px,4vw,56px) 80px;display:flex;flex-direction:column;gap:16px;max-width:1100px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n      <input value=\"{{ rName }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Consultant name\" style=\"flex:1 1 220px;padding:12px 14px;border-radius:10px;border:1px solid #CFD0C6;background:#FFFFFF;font-size:15px;color:#231F20\">\n      <input value=\"{{ rMgr }}\" sc-camel-on-change=\"{{ onMgr }}\" placeholder=\"Manager\" style=\"flex:1 1 220px;padding:12px 14px;border-radius:10px;border:1px solid #CFD0C6;background:#FFFFFF;font-size:15px;color:#231F20\">\n      <button sc-camel-on-click=\"{{ resetRubric }}\" style=\"all:unset;cursor:pointer;padding:12px 18px;border-radius:999px;border:1.5px solid #231F20;font-weight:700;font-size:14px\">Reset<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid #DEDFD6;border-radius:20px;overflow:hidden\">\n      <sc-for list=\"{{ rubric }}\" as=\"r\" hint-placeholder-count=\"11\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px 24p 02Fsc-if>\n          <sc-if value=\"{{ b.isCheck }}\" hint-placeholder-val=\"{{ false }}\">\n            <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ b.items }}\" as=\"it\"><li style=\"display:flex;gap:12px;font-size:16px;line-height:1.5\"><span style=\"flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid #231F20;margin-top:4px\"><\u002Fspan><span style=\"text-wrap:pretty\">{{ it }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isTable }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid #DEDFD6;border-radius:14px;overflow:hidden\">\n              <div style=\"padding:12px 16px;background:#231F20;color:#F3F3EE;font-size:13px;font-weight:700;letter-spacing:.04em\">{{ b.title }}<\u002Fdiv>\n              <sc-for list=\"{{ b.rows }}\" as=\"r\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:4px 16px;padding:12px 16px;border-top:1px solid #E8E8E1;font-size:15px;line-height:1.45\">\n                  <span style=\"flex:1 1 200px;font-weight:600\">{{ r.k }}<\u002Fspan>\n                  <span style=\"flex:2 1 220px;font-variant-numeric:tabular-nums\">{{ r.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isSlot }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-radius:14px;padding:22px;min-height:96px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#F3F3EE 0 10px,#EAEBE3 10px 20px);border:1px dashed #B1B3A8\">\n              <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#4A4547\">{{ b.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#231F20\">\n                <iframe src=\"{{ b.embed }}\" title=\"{{ b.text }}\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" sc-camel-allow-full-screen=\"{{ true }}\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\"><\u002Fiframe>\n              <\u002Fdiv>\n              <figcaption style=\"font-size:14px;font-weight:600\">{{ b.text }}<\u002Ffigcaption>\n            <\u002Ffigure>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.needsVideo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"width:100%;aspect-ratio:16/9;border-radius:14px;background:#231F20;background-image:linear-gradient(rgba(35,31,32,.88),rgba(35,31,32,.88)),url(&quot;b400925a-1974-43c8-9fb2-3d8bb6c92089&quot;);background-size:cover;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#F3F3EE;padding:24px;text-align:center\">\n              <div style=\"width:64px;height:64px;border-radius:50%;background:#7AEFB2;display:flex;align-items:center;justify-content:center\"><div style=\"width:0;height:0;border-left:18px solid #231F20;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px\"><\u002Fdiv><\u002Fdiv>\n              <span style=\"font-size:18px;font-weight:700\">{{ b.text }}<\u002Fspan>\n              <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#B1C3B5\">YouTube link needed<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isObj }}\" hint-placeholder-val=\"{{ false }}\">\n            <details style=\"border:1px solid #DEDFD6;border-radius:14px;padding:0 18px;background:#FFFFFF\">\n              <summary style=\"cursor:pointer;padding:16px 0;font-size:17px;font-weight:700;line-height:1.35\">“{{ b.q }}”<\u002Fsummary>\n              <div style=\"display:flex;flex-direction:column;gap:12px;padding:0 0 18px\">\n                <div style=\"display:flex;gap:12px;align-items:flex-start;background:#231F20;color:#F3F3EE;border-radius:10px;padding:12px 14px\"><span style=\"flex:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#7AEFB2;padding-top:3px\">Label<\u002Fspan><span style=\"font-size:16px;line-height:1.45\">{{ b.label }}<\u002Fspan><\u002Fdiv>\n                <p style=\"margin:0;font-size:15px;line-height:1.6;text-wrap:pretty\">{{ b.a }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isGo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div><button sc-camel-on-click=\"{{ b.onGo }}\" style=\"all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:#231F20;color:#7AEFB2;font-weight:700;font-size:15px\">{{ b.text }} →<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <footer style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:12px;padding-top:24px;border-top:1px solid #E8E8E1\">\n        <button sc-camel-on-click=\"{{ toggleDone }}\" style=\"all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;border:1.5px solid #231F20;background:{{ doneBg }};font-weight:700;font-size:15px\">{{ doneLabel }}<\u002Fbutton>\n        <sc-if value=\"{{ hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ goNext }}\" style=\"all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:#231F20;color:#F3F3EE;font-weight:700;font-size:15px\">Next: {{ nextTitle }} →<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Ffooter>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { data: window.VENTURE_TRAINING || null, view: 'skills', day: 0, sess: 0, done: {}, rub: { scores: {}, name: '', mgr: '', notes: '' } };\n  componentDidMount() {\n    try {\n      const s = JSON.parse(localStorage.getItem('vh-training') || '{}');\n      this.setState({ done: s.done || {}, rub: Object.assign({ scores: {}, name: '', mgr: '', notes: '' }, s.rub || {}), view: s.view || 'skills', day: s.day || 0, sess: s.sess || 0 });\n    } catch (e) {}\n    if (!this.state.data) {\n      this.t = setInterval(() => { if (window.VENTURE_TRAINING) { clearInterval(this.t); this.setState({ data: window.VENTURE_TRAINING }); } }, 50);\n    }\n  }\n  componentWillUnmount() { clearInterval(this.t); }\n  save(patch) {\n    this.setState(patch, () => {\n      const { done, rub, view, day, sess } = this.state;\n      try { localStorage.setItem('vh-training', JSON.stringify({ done, rub, view, day, sess })); } catch (e) {}\n    });\n  }\n  top() { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} }\n  firstReal(day) { const s = this.state.data.days[day].sessions; const i = s.findIndex(x => x.kind !== 'Break'); return i < 0 ? 0 : i; }\n  openDay(i) { this.save({ view: 'day', day: i, sess: this.firstReal(i) }); this.top(); }\n  ytEmbed(u) {\n    if (!u) return '';\n    const m = String(u).match(/(?:youtu\\.be\\/|v=|embed\\/|shorts\\/)([\\w-]{11})/);\n    const id = m ? m[1] : (/^[\\w-]{11}$/.test(u) ? u : '');\n    return id ? 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0' : '';\n  }\n  renderVals() {\n    const { data, view, day, sess, done, rub } = this.state;\n    const kindBg = { Core: '#7AEFB2', Voss: '#F7FF9E', 'Role play': '#B1C3B5', Teach: '#E8E8E1', Live: '#7AEFB2', Practice: '#B1C3B5', Systems: '#E8E8E1', Kickoff: '#F7FF9E' };\n    const DAYMETA = [{ wd: 'Mon', cal: 1 }, { wd: 'Tue', cal: 2 }, { wd: 'Thu', cal: 4 }, { wd: 'Fri', cal: 5 }, { wd: 'Mon', cal: 8 }];\n    const base = {\n      goSkills: () => { this.save({ view: 'skills' }); this.top(); },\n      goRubric: () => { this.save({ view: 'rubric' }); this.top(); },\n      startDay1: () => this.openDay(0),\n      skillsBg: view === 'skills' ? '#7AEFB2' : 'transparent', skillsFg: view === 'skills' ? '#231F20' : '#F3F3EE',\n      rubricBg: view === 'rubric' ? '#7AEFB2' : 'transparent', rubricFg: view === 'rubric' ? '#231F20' : '#F3F3EE',\n      isSkills: view === 'skills', isDay: view === 'day', isRubric: view === 'rubric'\n    };\n    if (!data) return Object.assign(base, { navDays: [], skills: [], agenda: [], blocks: [], rubric: [] });\n\n    const key = (d, s) => d + ':' + s;\n    const counts = data.days.map((d, di) => { const real = d.sessions.map((s, si) => ({ s, si })).filter(x => x.s.kind !== 'Break'); return { total: real.length, n: real.filter(x => done[key(di, x.si)]).length }; });\n    const navDays = [];\n    data.days.forEach((d, i) => {\n      const act = view === 'day' && day === i;\n      navDays.push({ isDay: true, isMarker: false, label: 'Day ' + d.n + ' · ' + DAYMETA[i].wd, title: d.title, count: counts[i].n + '/' + counts[i].total, pct: Math.round(100 * counts[i].n / Math.max(1, counts[i].total)) + '%', bg: act ? '#7AEFB2' : 'transparent', fg: act ? '#231F20' : '#F3F3EE', onClick: () => this.openDay(i) });\n      if (i === 1) navDays.push({ isMarker: true, isDay: false, label: 'Wed', title: 'Out of office' });\n    });\n    navDays.push({ isMarker: true, isDay: false, label: 'Tue', title: 'Day 9 · First appointment' });\n\n    const skills = data.skills.map(k => Object.assign({}, k, { badgeBg: k.n <= 5 ? '#7AEFB2' : '#B1C3B5', say: k.say || '' }));\n\n    const D = data.days[day] || data.days[0];\n    const S = D.sessions[sess] || D.sessions[0];\n    const agenda = D.sessions.map((s, si) => {\n      const isB = s.kind === 'Break', act = si === sess, dn = !!done[key(day, si)];\n      return { time: s.time, title: s.title, isBreak: isB, notBreak: !isB, bg: act ? '#FFFFFF' : 'transparent', weight: act ? 700 : 500, ring: dn ? '#1F6B47' : '#A9A59F', dot: dn ? '#7AEFB2' : 'transparent', onClick: () => { this.save({ sess: si }); this.top(); } };\n    });\n    const blocks = (S.blocks || []).map(b => {\n      const embed = b.t === 'video' ? this.ytEmbed(b.yt) : '';\n      return Object.assign({}, b, {\n        isP: b.t === 'p', isH: b.t === 'h', isList: b.t === 'list', isSay: b.t === 'say', isRule: b.t === 'rule', isPass: b.t === 'pass', isSetup: b.t === 'setup', isNote: b.t === 'note', isSteps: b.t === 'steps', isCards: b.t === 'cards', isCheck: b.t === 'check', isTable: b.t === 'table', isSlot: b.t === 'slot', isObj: b.t === 'obj', isGo: b.t === 'go',\n        hasVideo: b.t === 'video' && !!embed, needsVideo: b.t === 'video' && !embed, embed,\n        items: b.t === 'steps' ? b.items.map((x, i) => Object.assign({}, x, { num: i + 1 })) : b.items,\n        onGo: b.t === 'go' ? () => { this.save({ view: b.view }); this.top(); } : undefined\n      });\n    });\n    let nextIdx = -1;\n    for (let i = sess + 1; i < D.sessions.length; i++) if (D.sessions[i].kind !== 'Break') { nextIdx = i; break; }\n    const isDone = !!done[key(day, sess)];\n\n    const levels = ['Missed', 'Attempted', 'Partial', 'Solid', 'Strong'];\n    let total = 0;\n    const rubric = data.rubric.map(r => {\n      const v = rub.scores[r.id];\n      const pts = v == null ? 0 : r.w * v / 4; total += pts;\n      return { title: r.title, good: r.good, wLabel: r.w + ' pts', pts: v == null ? '—' : (Math.round(pts * 10) / 10), levels: [0, 1, 2, 3, 4].map(n => ({ v: n, tip: levels[n], bg: v === n ? '#7AEFB2' : '#FFFFFF', onClick: () => this.save({ rub: Object.assign({}, rub, { scores: Object.assign({}, rub.scores, { [r.id]: n }) }) }) })) };\n    });\n    const scored = Object.keys(rub.scores).length, score = Math.round(total);\n    const pass = score >= 80;\n\n    return Object.assign(base, {\n      navDays, skills, agenda, blocks, rubric,\n      dayEyebrow: 'Day ' + D.n + ' of 8 · ' + (D.weekday || ['Monday', 'Tuesday', 'Thursday', 'Friday', 'Monday'][day]) + ' · In office',\n      dayTitle: D.title, dayGoal: D.goal,\n      dayPct: Math.round(100 * counts[day].n / Math.max(1, counts[day].total)) + '%', dayCount: counts[day].n + ' of ' + counts[day].total + ' sessions',\n      sTime: S.time, sTitle: S.title, sKind: S.kind, sKindBg: kindBg[S.kind] || '#E8E8E1', sDraft: !!S.draft,\n      toggleDone: () => this.save({ done: Object.assign({}, done, { [key(day, sess)]: !isDone }) }),\n      doneLabel: isDone ? '✓ Completed' : 'Mark complete', doneBg: isDone ? '#7AEFB2' : 'transparent',\n      hasNext: nextIdx >= 0, nextTitle: nextIdx >= 0 ? D.sessions[nextIdx].title : '',\n      goNext: () => { const dn = Object.assign({}, done, { [key(day, sess)]: true }); this.save({ sess: nextIdx, done: dn }); this.top(); },\n      score: scored ? score : '—', scoreColor: !scored ? '#F3F3EE' : pass ? '#7AEFB2' : '#F7FF9E',\n      scoreStatus: !scored ? 'Not scored yet' : (pass ? 'Pass' : 'Below 80') + ' · ' + scored + ' of ' + data.rubric.length + ' scored',\n      rubricNav: scored ? score + '/100' : '80 to pass',\n      rName: rub.name, rMgr: rub.mgr, rNotes: rub.notes,\n      onName: e => this.save({ rub: Object.assign({}, rub, { name: e.target.value }) }),\n      onMgr: e => this.save({ rub: Object.assign({}, rub, { mgr: e.target.value }) }),\n      onNotes: e => this.save({ rub: Object.assign({}, rub, { notes: e.target.value }) }),\n      resetRubric: () => this.save({ rub: { scores: {}, name: '', mgr: '', notes: '' } })\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
